[package]
name = "arec"
version = "0.1.0"
edition = "2024"
description = "macOS CLI: record microphone + system audio into one stereo M4A file"
publish = false

[[bin]]
name = "arec"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
core-foundation = "0.10"
core-foundation-sys = "0.8"
ctrlc = { version = "3", features = ["termination"] }
objc2 = "0.6"
objc2-foundation = "0.3"
ringbuf = "0.4"

[profile.release]
lto = true
codegen-units = 1
